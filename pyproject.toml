[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "conda-cpufeatures-plugin"
version = "0.1.0"
description = "Expose CPU features to conda as virtual packages"
requires-python = ">=3.9"
dependencies = [
    "conda",
    "archspec",
    ]

[project.entry-points.conda]
conda-cpufeatures-plugin = "conda_cpufeatures"

[tool.setuptools]
py-modules = ["conda_cpufeatures"]
